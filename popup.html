<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Academic think tank</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Your Academic think tank</h1>
      <div class="auth-status" id="authStatus">
        <a href="#" id="authLink" style="font-size: 12px; color: #667eea; text-decoration: none;">登录</a>
      </div>
    </div>
    
    <div class="content">
      <!-- 登录提示区域（未登录时显示） -->
      <div id="authPrompt" class="auth-prompt" style="display: none;">
        <p class="auth-prompt-text">Please login to use Scholar Cat</p>
        <button id="goToLoginBtn" class="auth-btn">Go to Login</button>
      </div>
      
      <button id="logBtn" class="copy-btn">
        <span class="btn-text">Log this scholar</span>
        <span class="btn-loading" style="display: none;">
          <span class="spinner"></span>
          <span>Extracting...</span>
        </span>
      </button>
      
      <div id="status" class="status" style="display: none;"></div>
      
      <!-- Information display area -->
      <div id="infoDisplay" class="info-display" style="display: none;">
        <div class="info-display-header">
          <h3>Extracted Information</h3>
        </div>
        <div class="info-display-content">
          <div class="info-field">
            <label>Name:</label>
            <span id="info-name">-</span>
          </div>
          <div class="info-field">
            <label>Affiliation:</label>
            <span id="info-affiliation">-</span>
          </div>
          <div class="info-field">
            <label>Cited by:</label>
            <span id="info-cited_by">-</span>
          </div>
          <div class="info-field">
            <label>Canonical URL:</label>
            <span id="info-canonical" class="info-url">-</span>
          </div>
          <div class="info-field">
            <label>Homepage:</label>
            <span id="info-homepage" class="info-url">-</span>
          </div>
          <div class="info-field">
            <label>Research Topics:</label>
            <span id="info-topics">-</span>
          </div>
          <div class="info-field info-input">
            <label for="info-tags">Tags (comma-separated):</label>
            <input type="text" id="info-tags" class="info-input-field" placeholder="tag1, tag2, tag3">
          </div>
          <div class="info-field info-input">
            <label for="info-memo">Memo:</label>
            <textarea id="info-memo" class="info-textarea-input" placeholder="Add your notes here..."></textarea>
          </div>
          <div class="info-field info-output">
            <label>Full Output:</label>
            <textarea id="info-output" readonly class="info-textarea"></textarea>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
              <button id="copyOutputBtn" class="copy-output-btn" style="flex: 1;">Copy Full Output</button>
              <button id="saveToCloudBtn" class="save-cloud-btn" style="flex: 1;">
                <span class="btn-text">💾 保存到云端</span>
                <span class="btn-loading" style="display: none;">
                  <span class="spinner"></span>
                  <span>保存中...</span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="info-section">
        <p class="info-text">Click the button on a Google Scholar profile page to extract standardized information.</p>
        <p class="info-text">You can also right-click and select "Copy Scholar Info".</p>
      </div>
    </div>
  </div>
  
  <script src="config.local.js" onerror="console.log('config.local.js not found, using defaults')"></script>
  <script src="config.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>

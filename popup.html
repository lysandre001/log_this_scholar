<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar Cat</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="header-logo">🐱</span>
        <span class="header-title">Scholar Cat</span>
        <sup class="version-badge">beta</sup>
      </div>
      <div class="header-right">
        <!-- Login status emoji button -->
        <button class="auth-status" id="authStatus" title="Click to log in">
          <span id="authEmoji" class="auth-emoji">👻</span>
        </button>
        <!-- Account menu (shown when logged in and clicked) -->
        <div class="account-menu hidden" id="accountMenu">
          <div class="menu-user" id="menuUserInfo">
            <span id="menuUserName">User</span>
          </div>
          <button class="menu-item" id="logoutBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Log out</span>
          </button>
        </div>
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="content">
      <!-- Status messages above button -->
      <div id="status" class="status" style="display: none;"></div>
      
      <!-- 圆形主按钮 -->
      <div class="main-action">
        <button id="logBtn" class="main-btn">
          <svg class="btn-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span class="btn-text">log this</span>
          <span class="btn-loading" style="display: none;">
            <span class="spinner"></span>
          </span>
        </button>
      </div>
      
      <div id="status" class="status" style="display: none;"></div>
      
      <!-- Information display area -->
      <div id="infoDisplay" class="info-display" style="display: none;">
        <div class="info-display-header">
          <h3>Extracted Information</h3>
        </div>
        <div class="info-display-content">
          <div class="info-field">
            <label>Name:</label>
            <span id="info-name">-</span>
          </div>
          <div class="info-field">
            <label>Affiliation:</label>
            <span id="info-affiliation">-</span>
          </div>
          <div class="info-field">
            <label>Cited by:</label>
            <span id="info-cited_by">-</span>
          </div>
          <div class="info-field">
            <label>Canonical URL:</label>
            <span id="info-canonical" class="info-url">-</span>
          </div>
          <div class="info-field">
            <label>Homepage:</label>
            <span id="info-homepage" class="info-url">-</span>
          </div>
          <div class="info-field">
            <label>Research Topics:</label>
            <span id="info-topics">-</span>
          </div>
          <div class="info-field info-input">
            <label for="info-tags">Tags (comma-separated):</label>
            <input type="text" id="info-tags" class="info-input-field" placeholder="tag1, tag2, tag3">
          </div>
          <div class="info-field info-input">
            <label for="info-memo">Memo:</label>
            <textarea id="info-memo" class="info-textarea-input" placeholder="Add your notes here..."></textarea>
          </div>
          <div class="info-field info-output">
            <label>Full Output:</label>
            <textarea id="info-output" readonly class="info-textarea"></textarea>
            <div class="action-buttons">
              <button id="copyOutputBtn" class="action-btn secondary">Copy</button>
              <button id="saveToCloudBtn" class="action-btn primary">
                <span class="btn-text">Save it</span>
                <span class="btn-loading" style="display: none;">
                  <span class="spinner small"></span>
                  <span>Saving...</span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Hint text at bottom -->
      <p class="hint-text">Click the button on a Google Scholar profile page to extract standardized information.</p>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
      <button id="websiteBtn" class="footer-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span id="websiteBtnText">Go to Website</span>
      </button>
      
      <div class="more-dropdown">
        <button class="footer-btn" id="moreBtn">
          <span>More</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="more-menu hidden" id="moreMenu">
          <a href="#" id="privacyLink" class="menu-item">Privacy Policy</a>
          <a href="#" id="helpLink" class="menu-item">Help</a>
        </div>
      </div>
    </footer>
  </div>
  
  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Scholar Cat</h2>
      <p class="modal-subtitle">Sign in to your account</p>
      
      <div id="loginError" class="error-message hidden"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign in</button>
      </form>
      
      <div class="modal-footer">
        Don't have an account? <a href="#" id="goToRegister">Register on website</a>
      </div>
    </div>
  </div>
  
  <script src="config.local.js" onerror="console.log('config.local.js not found, using defaults')"></script>
  <script src="config.js"></script>
  <script src="lib/config-loader.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar Catcher - 登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 12px;
      color: #666;
    }

    .tab-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      color: #666;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.3s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #333;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #5568d3;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 12px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .user-info {
      display: none;
      text-align: center;
    }

    .user-info .email {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .user-info .user-id {
      font-size: 11px;
      color: #999;
      margin-bottom: 16px;
      word-break: break-all;
    }

    .link {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    #loginForm, #registerForm {
      display: none;
    }

    #loginForm.active, #registerForm.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="header">
      <h1>Scholar Catcher</h1>
      <p>学者信息管理工具</p>
    </div>

    <div id="status" class="status"></div>

    <!-- 已登录状态 -->
    <div id="userInfo" class="user-info">
      <div class="email" id="userEmail">-</div>
      <div class="user-id" id="userId">-</div>
      <button class="btn" id="logoutBtn">退出登录</button>
      <a href="#" class="link" id="goToMainBtn">返回主界面</a>
    </div>

    <!-- 未登录状态 -->
    <div id="authForms">
      <div class="tab-container">
        <div class="tab active" data-tab="login">登录</div>
        <div class="tab" data-tab="register">注册</div>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="active">
        <div class="form-group">
          <label for="loginEmail">邮箱</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" id="loginBtn">登录</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm">
        <div class="form-group">
          <label for="registerEmail">邮箱</label>
          <input type="email" id="registerEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="registerPassword">密码</label>
          <input type="password" id="registerPassword" placeholder="至少 6 个字符" required>
        </div>
        <div class="form-group">
          <label for="registerPasswordConfirm">确认密码</label>
          <input type="password" id="registerPasswordConfirm" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="btn" id="registerBtn">注册</button>
      </form>
    </div>
  </div>

  <script src="config.local.js" onerror="console.log('config.local.js not found, using defaults')"></script>
  <script src="config.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
